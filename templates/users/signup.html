<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register — ConsentHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
{% include "partials/toasts.html" %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="text-center mb-4">
        <span class="rounded-3 bg-primary d-inline-flex align-items-center justify-content-center mb-2"
              style="width:48px;height:48px;">
          <span class="fw-bold text-white fs-5">CM</span>
        </span>
        <h4 class="fw-semibold mb-0">Create an account</h4>
        <small class="text-muted">ConsentHub — Health Records Consent Management</small>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form method="POST" novalidate>
            {% csrf_token %}

            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label fw-medium">First name</label>
                <input type="text" name="first_name" class="form-control"
                       placeholder="First name"
                       value="{{ form.first_name.value|default:'' }}" required>
              </div>
              <div class="col-6">
                <label class="form-label fw-medium">Last name</label>
                <input type="text" name="last_name" class="form-control"
                       placeholder="Last name"
                       value="{{ form.last_name.value|default:'' }}" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Email address</label>
              <input type="email" name="email" class="form-control"
                     placeholder="you@example.com"
                     value="{{ form.email.value|default:'' }}" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Organisation <span class="text-muted fw-normal">(optional)</span></label>
              <input type="text" name="organisation" class="form-control"
                     placeholder="Your organisation name"
                     value="{{ form.organisation.value|default:'' }}">
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Role</label>
              <select name="role" class="form-select" required>
                <option value="" disabled selected>Select your role</option>
                {% for role in roles %}
                  <option value="{{ role.name }}"
                    {% if form.role.value == role.name %}selected{% endif %}>
                    {{ role.get_name_display }}
                  </option>
                {% endfor %}
              </select>
              <div class="form-text">
                <i class="bi bi-info-circle me-1"></i>
                Your role determines what data you can access in the system.
              </div>
            </div>

            <div id="roleDescriptions" class="mb-3 d-none">
              <div class="alert alert-info py-2 mb-0 small" id="roleDesc"></div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Password</label>
              <div class="input-group">
                <input type="password" name="password1" id="pwd1"
                       class="form-control" placeholder="At least 8 characters" required>
                <button class="btn btn-outline-secondary" type="button"
                        onclick="togglePwd('pwd1', this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-medium">Confirm password</label>
              <div class="input-group">
                <input type="password" name="password2" id="pwd2"
                       class="form-control" placeholder="Re-enter password" required>
                <button class="btn btn-outline-secondary" type="button"
                        onclick="togglePwd('pwd2', this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-person-plus me-1"></i> Create account
              </button>
            </div>
          </form>

          <div class="text-center">
            <small class="text-muted">Already have an account?
              <a href="{% url 'users:login_view' %}" class="text-decoration-none">Sign in</a>
            </small>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon  = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.replace('bi-eye', 'bi-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.replace('bi-eye-slash', 'bi-eye');
  }
}

const roleDescs = {
  subject:         "Data Subject — Patients who manage their own health data consent.",
  processor:       "Data Processor — Healthcare providers who handle patient data.",
  regulator:       "Regulator — Oversight bodies who audit compliance.",
  researcher:      "Researcher — Access anonymised data for research purposes.",
  insurance_agent: "Insurance Agent — Access relevant records for insurance assessments.",
};

document.querySelector('select[name="role"]').addEventListener('change', function () {
  const desc   = roleDescs[this.value];
  const box    = document.getElementById('roleDescriptions');
  const text   = document.getElementById('roleDesc');
  if (desc) {
    text.textContent = desc;
    box.classList.remove('d-none');
  } else {
    box.classList.add('d-none');
  }
});
</script>
</body>
</html>
