{% if messages %}

<div class="toast-container position-fixed top-3 end-0 p-3" style="z-index: 1100">

    {% for message in messages %}
    <div class="toast align-items-center text-bg-{{ message.tags|default:'info' }} border-0"
         role="alert"
         aria-live="assertive"
         aria-atomic="true"
         data-bs-delay="3000">

        <div class="d-flex">
            <div class="toast-body">
                {{ message }}
            </div>

            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast">
            </button>
        </div>

    </div>
    {% endfor %}

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const toastElList = document.querySelectorAll('.toast')
    toastElList.forEach(function(toastEl) {
        const toast = new bootstrap.Toast(toastEl)
        toast.show()
    })
})
</script>

{% endif %}
