{% extends "base.html" %}
{% block title %}Change Password — ConsentHub{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div class="d-flex align-items-center gap-2 mb-4">
        <a href="{% url 'users:profile_view' %}" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h5 class="mb-0 fw-semibold">Change password</h5>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form method="POST" novalidate>
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label fw-medium">Current password</label>
              <div class="input-group">
                <input type="password" name="current_password" id="cur" class="form-control" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('cur', this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <hr class="my-3">

            <div class="mb-3">
              <label class="form-label fw-medium">New password</label>
              <div class="input-group">
                <input type="password" name="new_password" id="np" class="form-control"
                       placeholder="At least 8 characters" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('np', this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-medium">Confirm new password</label>
              <div class="input-group">
                <input type="password" name="confirm_password" id="cp" class="form-control" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePwd('cp', this)">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-warning">
                <i class="bi bi-shield-check me-1"></i> Update password
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd(id, btn) {
  const el = document.getElementById(id);
  const ic = btn.querySelector('i');
  el.type = el.type === 'password' ? 'text' : 'password';
  ic.classList.toggle('bi-eye');
  ic.classList.toggle('bi-eye-slash');
}
</script>
{% endblock %}
