<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
{% include "partials/toasts.html" %}

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="text-center mb-4">Create an account</h3>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="row">
                            <div class="mb-3 col-md-6">
                                <label class="form-label">First name</label>
                                <input type="text" name="first_name" class="form-control"
                                       placeholder="Enter first name" required>
                            </div>

                            <div class="mb-3 col-md-6">
                                <label class="form-label">Last name</label>
                                <input type="text" name="last_name" class="form-control"
                                       placeholder="Enter last name" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control"
                                   placeholder="Enter email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Organisation</label>
                            <input type="text" name="organisation" class="form-control"
                                   placeholder="Your organisation name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <select name="role" class="form-select" required>
                                <option value="" selected disabled>Select your role</option>
                                <option value="subject">Data Subject</option>
                                <option value="processor">Data Processor</option>
                                <option value="regulator">Regulator</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password1" class="form-control"
                                   placeholder="Enter password" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm password</label>
                            <input type="password" name="password2" class="form-control"
                                   placeholder="Re-enter password" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Register</button>
                        </div>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-0">Already have an account?</p>
                        <a href="{% url 'users:login_view' %}">Login</a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
